<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — CloudDeck</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#05090b" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/styles.css" />

  <body>
    <main class="error-page">
      <div class="error-card">
        <p class="error-code">404 / NO SUCH DECK</p>

        <div class="error-actions">
          <a class="btn btn-primary" href="/">Back to CloudDeck</a>
          <a class="btn btn-secondary" href="https://github.com/dakshraman/clouddeck" target="_blank" rel="noreferrer">GitHub</a>

      </div>
