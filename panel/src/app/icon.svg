<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CloudDeck">
  <defs>
    <linearGradient id="cd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182D35"/>
      <stop offset="100%" stop-color="#0C171C"/>
    </linearGradient>
    <linearGradient id="cd-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74B8CC" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#D2ADAC" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="cd-deck" x1="10" y1="13" x2="54" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8FD2E5"/>
      <stop offset="50%" stop-color="#74B8CC"/>
      <stop offset="100%" stop-color="#235361"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#cd-bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#cd-border)" stroke-width="1.2"/>
  <!-- Top Deck Face -->
  <path d="M32 13 54 24.5 32 36 10 24.5 32 13Z" fill="url(#cd-deck)"/>
  <!-- Middle Tier (Sky/Marine Teal) -->
  <path d="M10 32.5 32 44 54 32.5" fill="none" stroke="#74B8CC" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <!-- Foundation Tier (Pastel Peach Accent) -->
  <path d="M10 41 32 52.5 54 41" fill="none" stroke="#FAAA93" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
</svg>
