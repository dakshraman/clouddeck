# CloudDeck development stack: agent container (nginx + privileged worker)
# and the panel.
#
# This file is dev-oriented: it publishes the agent API on the host for easy
# inspection. Production must keep the agent off public interfaces — it has no
# authentication in v0.1 and trusts anything that can reach it. Bind only the
# panel and put it behind TLS (see docs/deployment.md).
#
# Usage:
#   docker compose up -d --build   # or: make up
#   docker compose logs -f         # or: make logs

services:
  server:
    build: ./agent
    container_name: clouddeck-server
    ports:
      - "9090:9090"   # agent API — dev only; production binds 127.0.0.1
      - "8080:80"     # sites served by the container's nginx
    environment:
      AGENT_LISTEN: 0.0.0.0:9090
      AGENT_STATE_DIR: /data
      AGENT_NGINX_SITES_DIR: /etc/nginx/conf.d
      AGENT_WEBROOT: /www/wwwroot
    volumes:
      - clouddeck-server-data:/data
      - clouddeck-server-nginx:/etc/nginx/conf.d   # site configs survive container recreation
      - clouddeck-server-webroot:/www/wwwroot      # site files survive container recreation
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9090/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  panel:
    build: ./panel
    container_name: clouddeck-panel
    ports:
      - "3000:3000"
    environment:
      AGENT_URL: http://server:9090
      PANEL_SESSION_SECRET: dev-secret-change-me
      PANEL_DATA_DIR: /data
    volumes:
      - clouddeck-panel-data:/data
    depends_on:
      server:
        condition: service_healthy

volumes:
  clouddeck-server-data:
  clouddeck-server-nginx:
  clouddeck-server-webroot:
  clouddeck-panel-data:
