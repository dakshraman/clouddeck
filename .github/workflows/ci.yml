name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  agent:
    name: Agent (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  panel:
    name: Panel (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Panel version matches agent
        run: |
          agent_v=$(grep -oP '(?<=const Version = ")[^"]+' ../agent/internal/server/server.go)
          [ "$(node -p "require('./package.json').version")" = "$agent_v" ]
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
