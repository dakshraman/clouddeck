name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Build agent binaries (static)
        run: |
          mkdir -p dist
          cd agent
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../dist/clouddeck-agent-linux-amd64 ./cmd/clouddeck-agent
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../dist/clouddeck-agent-linux-arm64 ./cmd/clouddeck-agent

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build panel standalone bundle
        run: |
          cd panel
          npm ci
          npm run build
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          tar -czf ../dist/clouddeck-panel.tar.gz -C .next/standalone .

      - name: Checksums
        run: cd dist && sha256sum clouddeck-agent-linux-amd64 clouddeck-agent-linux-arm64 clouddeck-panel.tar.gz > SHA256SUMS

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* scripts/install.sh --clobber
