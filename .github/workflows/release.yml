name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Channel policy:
      # - push of a v* tag          -> publish that version as a stable release
      # - push to main, new version -> tag it and publish the stable release in
      #   this run (a GITHUB_TOKEN tag push does not trigger workflows)
      # - push to main, same version -> refresh the rolling "dev" pre-release
      - name: Decide release channel
        id: channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' agent/internal/server/server.go)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          else
            # A tag pushed with github.token does not trigger workflows, so
            # this run publishes the stable release itself.
            git push origin ":refs/tags/v$VERSION" 2>/dev/null || true
            git tag -f "v$VERSION"
            git push origin "v$VERSION"
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Build agent binaries (static)
        run: |
          mkdir -p dist
          cd agent
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../dist/clouddeck-agent-linux-amd64 ./cmd/clouddeck-agent
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../dist/clouddeck-agent-linux-arm64 ./cmd/clouddeck-agent

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build panel standalone bundle
        run: |
          cd panel
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run build
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          # used by the clouddeck CLI to reset panel passwords
          mkdir -p .next/standalone/node_modules
          cp -r node_modules/bcryptjs .next/standalone/node_modules/
          # never ship a runtime data dir; PANEL_DATA_DIR points at /var/lib
          rm -rf .next/standalone/data
          tar -czf ../dist/clouddeck-panel.tar.gz -C .next/standalone .
          cp ../scripts/clouddeck ../dist/clouddeck-cli
          chmod +x ../dist/clouddeck-cli
          test -f .next/standalone/server.js
          test -x ../dist/clouddeck-cli

      - name: Checksums
        run: cd dist && sha256sum clouddeck-agent-linux-amd64 clouddeck-agent-linux-arm64 clouddeck-panel.tar.gz clouddeck-cli > SHA256SUMS

      - name: Verify release artifacts
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          tar -tzf clouddeck-panel.tar.gz | grep -qx './server.js'
          test -s clouddeck-agent-linux-amd64
          test -s clouddeck-agent-linux-arm64

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.channel.outputs.tag }}"
          if [ "$TAG" = "dev" ]; then
            gh release view dev >/dev/null 2>&1 || \
              gh release create dev --title "Dev build" --prerelease --target "$GITHUB_SHA" \
                --notes "Rolling pre-release built from main. Installs that use releases/latest ignore this one."
            git tag -f dev "$GITHUB_SHA" && git push -f origin dev
          else
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* scripts/install.sh --clobber
